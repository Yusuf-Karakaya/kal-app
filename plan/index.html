<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Kal</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#e5e7eb;--acc:#0ea5e9;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#141c2f;--fg:#e2e8f0;--mut:#94a3b8;--line:#243049}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:16px 16px 4px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{padding:8px 12px;max-width:640px;margin:0 auto}
h3{margin:18px 4px 8px;font-size:15px}section h3{margin-top:0}
h4{margin:0;font-size:15px}h5{margin:10px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row.top{align-items:flex-start}
small{display:block;color:var(--mut);font-size:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 10px}
.pill{position:relative;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 0;border-top:3px solid var(--c);font:inherit}
.pill b{display:block;font-size:13px}.pill small{font-size:10px}.pill .ofs{opacity:.75;font-size:9px;text-transform:uppercase}
.pill.on{background:var(--c);color:#fff}.pill.on small{color:#fff}
.dot{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.hero h2{margin:0;font-size:18px}
.big{font-size:30px;font-weight:700;margin:6px 0}.big span{font-size:15px;color:var(--mut);font-weight:400}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.macros{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--mut)}.macros b{color:var(--fg)}
select,input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
button{cursor:pointer}button.danger{color:#dc2626}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.meal ul,.wo ul,.rules,.shop,.log{list-style:none;margin:8px 0 0;padding:0}
.meal li,.shop li,.log li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
.meal li span:last-child{color:var(--mut);white-space:nowrap}
.meal.done{opacity:.55}.meal.extra{border-left:4px solid var(--acc)}
.mini{margin-top:8px;font-size:12px;color:var(--mut)}.mini em{color:var(--acc);font-style:normal}
.wo li{padding:3px 0 3px 14px;position:relative}.wo li:before{content:"•";position:absolute;left:2px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin:10px 0 0}
.chk{padding:8px 0;border-bottom:1px solid var(--line)}.chk:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:12px}
tbody tr{cursor:pointer}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--c);color:#fff;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:10px;padding:8px 10px}.stats b{font-size:20px;margin-right:4px}.stats span{color:var(--mut);font-size:12px}
.sup{padding:8px 0;border-bottom:1px solid var(--line)}.sup:last-child{border:0}.sup p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.rules li{padding:4px 0;font-size:14px}
.form input[type=number]{width:80px}.form input[type=date]{flex:1}
.fld{display:flex;justify-content:space-between;align-items:center;padding:6px 0;gap:10px}.fld input{width:110px;text-align:right}.fld select{max-width:60%}
.shop label{display:flex;gap:8px;align-items:center}.shop input{width:18px;height:18px}
.log button{border:0;background:none;color:var(--mut);padding:0 4px}
.chart{width:100%;margin-top:12px}.chart .line{fill:none;stroke:var(--acc);stroke-width:2}.chart .pt{fill:var(--acc)}
.chart .goal{stroke:var(--ok);stroke-dasharray:4 4}.chart .lbl{font-size:10px;fill:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;border-radius:0;padding:10px 0;font-size:11px;color:var(--mut)}
nav button b{display:block;font-size:18px}nav button.on{color:var(--acc)}
.ofc{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut);margin-left:auto}.ofc input{width:18px;height:18px}
.store{margin-top:6px;font-size:12px;color:var(--fg);background:var(--bg);border-radius:8px;padding:5px 8px}
.boxes{list-style:none;margin:0;padding:0}.boxes li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.boxes li div span{display:block;font-size:13px;color:var(--mut)}.boxes em{font-style:normal;font-size:11px;white-space:nowrap;padding:2px 7px;border-radius:12px;background:var(--bg)}.boxes em.frz{background:#dbeafe;color:#1e3a8a}
.steps{margin:0;padding-left:0;list-style:none}.steps li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.steps b{min-width:74px;color:var(--acc);font-size:13px}
</style>
<style>
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
#gate h1{margin:0 0 4px;font-size:22px}#gate p{margin:0 0 16px;color:var(--mut);font-size:14px}
#gate input[type=password]{width:100%;padding:12px;font-size:16px;margin-bottom:10px}
#gate label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin-bottom:14px}
#gate button{width:100%;padding:12px;font-size:16px;background:var(--acc);color:#fff;border:0}
#gate .err{color:#dc2626;font-size:14px;min-height:20px;margin:10px 0 0}
</style>
</head>
<body>
<div id="gate"><form>
  <h1>🔒 Kal</h1><p>Devam etmek için token gir.</p>
  <input type="password" id="tok" autocomplete="current-password" placeholder="Token" autocapitalize="off" spellcheck="false">
  <label><input type="checkbox" id="rem" checked> Bu cihazda hatırla</label>
  <button type="submit" id="go">Aç</button>
  <div class="err" id="err"></div>
</form></div>

  const TK = "kal.token", SK = "kal.enc";
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const u64 = (u) => btoa(String.fromCharCode(...u));
  const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
               del: (k) => { try { localStorage.removeItem(k); } catch {} } };
  const $ = (id) => document.getElementById(id);

  async function keys(token) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(token), "PBKDF2", false, ["deriveBits"]);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter }, base, 512));
    const imp = (b) => crypto.subtle.importKey("raw", b, "AES-GCM", false, ["encrypt", "decrypt"]);
    return [await imp(bits.slice(0, 32)), await imp(bits.slice(32))];
  }
  const dec = async (k, iv, ct) => new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(iv) }, k, b64(ct)));

  async function unlock(token, remember) {
    $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Açılıyor…";
    try {
      const [kApp, kData] = await keys(token);
      let body;
      try { body = await dec(kApp, P.iv, P.ct); } catch { throw new Error("Token hatalı."); }
      let state = {};
      const raw = ls.get(SK);
      if (raw) { try { const o = JSON.parse(raw); state = JSON.parse(await dec(kData, o.iv, o.ct)); } catch { state = {}; } }
      let chain = Promise.resolve();
      window.KAL_STORE = {
        load: () => state,
        save: (o) => {
          const txt = JSON.stringify(o);
          chain = chain.then(async () => {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, kData, new TextEncoder().encode(txt)));
            ls.set(SK, JSON.stringify({ iv: u64(iv), ct: u64(ct) }));
          });
        },
      };
      window.KAL_LOCK = () => { ls.del(TK); location.replace(location.pathname); };
      if (remember) ls.set(TK, token); else ls.del(TK);
      if (location.hash) history.replaceState(null, "", location.pathname);
      $("gate").remove();
      const tpl = document.createElement("template");
      tpl.innerHTML = body;
      const scripts = [...tpl.content.querySelectorAll("script")];
      scripts.forEach((s) => s.remove());
      document.body.append(tpl.content);
      for (const s of scripts) { const n = document.createElement("script"); n.textContent = s.textContent; document.body.append(n); }
    } catch (e) {
      $("err").textContent = e.message || "Açılamadı.";
      $("go").disabled = false; $("go").textContent = "Aç";
      if (e.message === "Token hatalı.") ls.del(TK);
    }
  }

  $("gate").querySelector("form").onsubmit = (e) => { e.preventDefault(); const t = $("tok").value.trim(); if (t) unlock(t, $("rem").checked); };
  const auto = decodeURIComponent(location.hash.slice(1)) || ls.get(TK);
  if (auto) { $("tok").value = auto; unlock(auto, true); }
})();
